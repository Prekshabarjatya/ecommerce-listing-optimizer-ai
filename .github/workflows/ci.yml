name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests need a real Postgres (see app/database/schema.py's Stage 9
    # note on why this project moved off SQLite ":memory:") -- this service
    # container is what tests/conftest.py's TEST_DATABASE_URL points at by
    # default.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: santerra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No GROQ_API_KEY / network needed -- every LLM call is mocked
        # (tests/conftest.py sets a dummy key), fact_validator and the API's
        # DB-backed routes are exercised directly against the postgres
        # service above.
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t santerra-listing-ai:ci .
